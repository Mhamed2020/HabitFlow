name: Deploy client to GitHub Pages

# Publishes the static frontend (client/) to GitHub Pages.
# Note: Pages is static hosting only. The Express API (server/) is NOT deployed
# here, so /api calls fail until the client can target a separately hosted backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: check and build client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Locked deps (vitest, jsdom, jest-dom) require Node >= 22; use current LTS.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the same checks as ci.yml, so a broken commit never ships.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is "/HabitFlow" for https://mhamed2020.github.io/HabitFlow/
      # (or "" with a custom domain). The flag only affects this build; local dev is unchanged.
      - name: Build client
        run: npm run build -w client -- --base="${BASE_PATH}/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
