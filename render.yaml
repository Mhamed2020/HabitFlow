# Render Blueprint for the HabitFlow API (server/ workspace).
# Free plan: the service sleeps after ~15 min without traffic and takes ~1 min to wake up;
# the GitHub Pages frontend shows demo data meanwhile. The filesystem is ephemeral, so data
# lives in Turso (DATABASE_URL / DATABASE_AUTH_TOKEN), set in the Render dashboard.
services:
  - type: web
    name: habitflow-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Deploy only commits whose GitHub checks (CI) passed.
    autoDeployTrigger: checksPass
    buildCommand: npm ci
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CORS_ORIGIN
        value: https://mhamed2020.github.io
      # Opening the API root in a browser redirects to the app.
      - key: FRONTEND_URL
        value: https://mhamed2020.github.io/HabitFlow/
      # Dates are local time ('YYYY-MM-DD'): use the users' time zone, not the server's UTC,
      # or check-ins for "today" are rejected between midnight and 2 a.m. Paris time.
      - key: TZ
        value: Europe/Paris
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
